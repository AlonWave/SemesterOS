<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alon's Semester OS</title>
    
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href='data:application/manifest+json;base64,eyJuYW1lIjoiQWxvbiBPUyIsInNob3J0X25hbWUiOiJBbG9uIE9TIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiNmOGZhZmMiLCJ0aGVtZV9jb2xvciI6IiMyNTYzZWIifQ=='>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#151f32' } } } }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #ffffff; overscroll-behavior-y: none; }
        .dark body { background-color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        input, select, textarea { font-size: 16px !important; }
        
        /* Custom Pomodoro Font styling */
        .font-mono-timer { font-variant-numeric: tabular-nums; letter-spacing: -0.05em; }
    </style>
</head>
<body class="transition-colors duration-300 antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );
        
        const icons = {
            home: <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />,
            chart: <path d="M3 3v18h18 M18 17V9 M13 17V5 M8 17v-3" />,
            book: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></>,
            timer: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
            plus: <path d="M5 12h14 M12 5v14" />,
            moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />,
            sun: <><circle cx="12" cy="12" r="5" /><path d="M12 1v2 M12 21v2 M4.2 4.2l1.4 1.4 M18.4 18.4l1.4 1.4 M1 12h2 M21 12h2 M4.2 19.8l1.4-1.4 M18.4 5.6l1.4-1.4" /></>,
            trash: <path d="M3 6h18 M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6 M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />,
            check: <path d="M20 6 9 17l-5-5" />,
            x: <path d="M18 6 6 18 M6 6l12 12" />,
            download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></>,
            upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></>,
            settings: <><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></>,
            calendar: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>
        };

        const GRADE_VALUES = { 'A': 4.0, 'B+': 3.5, 'B': 3.0, 'C+': 2.5, 'C': 2.0, 'D': 1.0, 'F': 0.0 };
        const INITIAL_COURSES = [
          { id: 1, code: 'HISTO 12', name: 'Readings in PH History', section: 'A', venue: 'B-209', day: 'Mon/Thu', time: '08:00 - 09:30', cuts: 0, maxCuts: 6, units: 3, grade: null, notes: '', color: 'border-blue-200 bg-blue-50 dark:bg-blue-900/20 dark:border-blue-800 text-blue-800 dark:text-blue-200' },
          { id: 2, code: 'SOCIO 192.1', name: 'Stat Analysis', section: 'B', venue: 'SOM 111', day: 'Mon/Thu', time: '09:30 - 11:00', cuts: 0, maxCuts: 6, units: 3, grade: null, notes: '', color: 'border-red-200 bg-red-50 dark:bg-red-900/20 dark:border-red-800 text-red-800 dark:text-red-200' },
          { id: 3, code: 'SOCIO 103.2', name: 'Contemp. Socio Theory', section: 'D', venue: 'B-306', day: 'Mon/Thu', time: '12:30 - 14:00', cuts: 0, maxCuts: 6, units: 3, grade: null, notes: '', color: 'border-purple-200 bg-purple-50 dark:bg-purple-900/20 dark:border-purple-800 text-purple-800 dark:text-purple-200' },
          { id: 4, code: 'ArtAp 10', name: 'Art Appreciation', section: 'E1', venue: 'Faura (ABS-CBN)', day: 'Mon/Thu', time: '14:00 - 15:30', cuts: 0, maxCuts: 6, units: 3, grade: null, notes: '', color: 'border-pink-200 bg-pink-50 dark:bg-pink-900/20 dark:border-pink-800 text-pink-800 dark:text-pink-200' },
          { id: 5, code: 'PHILO 11.03', name: 'The Human Condition', section: 'F2', venue: 'G-204', day: 'Mon/Thu', time: '15:30 - 17:00', cuts: 0, maxCuts: 6, units: 3, grade: null, notes: '', color: 'border-amber-200 bg-amber-50 dark:bg-amber-900/20 dark:border-amber-800 text-amber-800 dark:text-amber-200' },
          { id: 6, code: 'POLSCI 21', name: 'Politics & Governance', section: 'K', venue: 'BEL 207', day: 'Tue/Fri', time: '09:30 - 11:00', cuts: 0, maxCuts: 6, units: 3, grade: null, notes: '', color: 'border-green-200 bg-green-50 dark:bg-green-900/20 dark:border-green-800 text-green-800 dark:text-green-200' },
          { id: 7, code: 'PEPC 16.04', name: 'Table Tennis', section: 'M', venue: 'Table Tennis Area', day: 'Tue/Fri', time: '13:00 - 14:00', cuts: 0, maxCuts: 6, units: 2, grade: null, notes: '', color: 'border-teal-200 bg-teal-50 dark:bg-teal-900/20 dark:border-teal-800 text-teal-800 dark:text-teal-200' },
        ];
        
        const INITIAL_READINGS = [
          { id: 1, course: 'HISTO 12', title: 'Primary Source Analysis: Ambeth Ocampo', status: 'To Read', module: 'Module 1' },
          { id: 2, course: 'SOCIO 103.2', title: 'Modernity and Self-Identity (Giddens)', status: 'In Progress', module: 'Week 2' },
        ];

        // Web Audio API Beep (No external files needed)
        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) { console.log("Audio not supported"); }
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl animate-slide-up border border-slate-100 dark:border-slate-700 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-bold text-slate-900 dark:text-white">{title}</h3>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full text-slate-500 dark:text-slate-400 transition-colors">
                                <Icon path={icons.x} className="w-5 h-5" />
                            </button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        };

        function App() {
          // --- STATES ---
          const [darkMode, setDarkMode] = useState(() => localStorage.getItem('alon_theme') === 'dark');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [toast, setToast] = useState(null);
          
          const [courses, setCourses] = useState(() => { 
              try { const s = localStorage.getItem('alon_courses_v6'); return s ? JSON.parse(s) : INITIAL_COURSES; } 
              catch(e) { return INITIAL_COURSES; }
          });
          const [readings, setReadings] = useState(() => { 
              try { const s = localStorage.getItem('alon_readings_v6'); return s ? JSON.parse(s) : INITIAL_READINGS; }
              catch(e) { return INITIAL_READINGS; }
          });
          
          const [isReadingModalOpen, setReadingModalOpen] = useState(false);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [editingCourse, setEditingCourse] = useState(null);
          const [newReading, setNewReading] = useState({ title: '', module: '', course: '' });
          
          // Pomodoro State
          const [pomoTime, setPomoTime] = useState(25 * 60);
          const [isPomoRunning, setIsPomoRunning] = useState(false);
          const [pomoMode, setPomoMode] = useState('focus'); // focus | break

          const fileInputRef = useRef(null);

          // --- EFFECTS ---
          useEffect(() => {
              if (darkMode) {
                  document.documentElement.classList.add('dark');
                  document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f172a");
              } else {
                  document.documentElement.classList.remove('dark');
                  document.querySelector('meta[name="theme-color"]').setAttribute("content", "#ffffff");
              }
              localStorage.setItem('alon_theme', darkMode ? 'dark' : 'light');
          }, [darkMode]);

          useEffect(() => { localStorage.setItem('alon_courses_v6', JSON.stringify(courses)); }, [courses]);
          useEffect(() => { localStorage.setItem('alon_readings_v6', JSON.stringify(readings)); }, [readings]);

          useEffect(() => { 
              if(toast) { const timer = setTimeout(() => setToast(null), 3000); return () => clearTimeout(timer); } 
          }, [toast]);

          // Pomodoro Timer Logic
          useEffect(() => {
              let interval = null;
              if (isPomoRunning && pomoTime > 0) {
                  interval = setInterval(() => { setPomoTime(t => t - 1); }, 1000);
              } else if (isPomoRunning && pomoTime === 0) {
                  playBeep();
                  if (pomoMode === 'focus') {
                      setPomoMode('break');
                      setPomoTime(5 * 60);
                  } else {
                      setPomoMode('focus');
                      setPomoTime(25 * 60);
                      setIsPomoRunning(false); // Stop after break
                  }
              }
              return () => clearInterval(interval);
          }, [isPomoRunning, pomoTime, pomoMode]);

          // --- COMPUTED ---
          const greeting = useMemo(() => {
              const hour = new Date().getHours();
              if (hour < 12) return "Good morning";
              if (hour < 18) return "Good afternoon";
              return "Good evening";
          }, []);

          const sortedReadings = useMemo(() => {
              const order = { 'To Read': 1, 'In Progress': 2, 'Done': 3 };
              return [...readings].sort((a, b) => order[a.status] - order[b.status]);
          }, [readings]);

          const qpi = useMemo(() => {
              let totalUnits = 0, totalPoints = 0;
              courses.forEach(c => { 
                  if (c.grade && GRADE_VALUES[c.grade] !== undefined) { 
                      totalUnits += c.units; totalPoints += (c.units * GRADE_VALUES[c.grade]); 
                  } 
              });
              return totalUnits === 0 ? "0.00" : (totalPoints / totalUnits).toFixed(2);
          }, [courses]);

          const totalCuts = useMemo(() => courses.reduce((acc, c) => acc + c.cuts, 0), [courses]);
          
          const formatTime = (seconds) => {
              const m = Math.floor(seconds / 60).toString().padStart(2, '0');
              const s = (seconds % 60).toString().padStart(2, '0');
              return `${m}:${s}`;
          };

          const showToast = (msg, isError = false) => setToast({ msg, isError });

          // --- ACTIONS ---
          const handleAddReading = () => {
              if (!newReading.title || !newReading.course) return;
              setReadings([...readings, { id: Date.now(), status: 'To Read', ...newReading }]);
              setNewReading({ title: '', module: '', course: '' });
              setReadingModalOpen(false);
              showToast("Reading Added");
          };

          const deleteReading = (id, e) => { 
              e.stopPropagation(); setReadings(readings.filter(r => r.id !== id)); showToast("Reading Deleted"); 
          };

          const saveCourseEdit = () => { 
              setCourses(courses.map(c => c.id === editingCourse.id ? editingCourse : c)); 
              setEditingCourse(null); showToast("Course Updated"); 
          };

          // Export JSON
          const exportData = () => {
              const data = { timestamp: new Date().toISOString(), courses, readings };
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url; link.download = 'alon_semester_backup.json';
              link.click(); URL.revokeObjectURL(url);
              showToast("Backup Downloaded");
              setIsSettingsOpen(false);
          };

          // Import JSON
          const importData = (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (event) => {
                  try {
                      const data = JSON.parse(event.target.result);
                      if (data.courses) setCourses(data.courses);
                      if (data.readings) setReadings(data.readings);
                      showToast("Backup Restored!");
                      setIsSettingsOpen(false);
                  } catch (err) { showToast("Invalid backup file.", true); }
              };
              reader.readAsText(file);
              e.target.value = null;
          };

          // Generate iCal format for Google Calendar
          const exportCalendar = () => {
              let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Alon OS//EN\n";
              
              courses.forEach(c => {
                  // Simplified ICS generation for visual schedule representation
                  // Assuming current date is start of semester for demo purposes
                  let days = [];
                  if(c.day.includes("Mon")) days.push("MO");
                  if(c.day.includes("Tue")) days.push("TU");
                  if(c.day.includes("Wed")) days.push("WE");
                  if(c.day.includes("Thu")) days.push("TH");
                  if(c.day.includes("Fri")) days.push("FR");
                  
                  if(days.length > 0) {
                      const [start, end] = c.time.split(" - ");
                      ics += "BEGIN:VEVENT\n";
                      ics += `SUMMARY:${c.code} - ${c.name}\n`;
                      ics += `LOCATION:${c.venue}\n`;
                      ics += `RRULE:FREQ=WEEKLY;BYDAY=${days.join(',')};COUNT=30\n`;
                      ics += "END:VEVENT\n";
                  }
              });
              
              ics += "END:VCALENDAR";
              const blob = new Blob([ics], { type: 'text/calendar' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url; link.download = 'Alon_Schedule.ics';
              link.click(); URL.revokeObjectURL(url);
              showToast("Calendar Exported");
          };

          const factoryReset = () => {
              if(confirm("DANGER: This wipes all cuts, grades, and readings. Continue?")) {
                  setCourses(INITIAL_COURSES); setReadings(INITIAL_READINGS);
                  showToast("OS Reset to Factory"); setIsSettingsOpen(false);
              }
          };

          const getTodaySchedule = () => {
             const dayNum = new Date().getDay(); 
             let dayString = "";
             if (dayNum === 1 || dayNum === 4) dayString = "Mon/Thu"; 
             if (dayNum === 2 || dayNum === 5) dayString = "Tue/Fri"; 
             const todaysClasses = courses.filter(c => c.day === dayString);
             if (todaysClasses.length === 0) return { title: "Thursday (Demo)", classes: courses.filter(c => c.day === 'Mon/Thu') };
             const dayName = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dayNum];
             return { title: `Today (${dayName})`, classes: todaysClasses };
          };
          
          const schedule = getTodaySchedule();

          return (
            <div className="min-h-screen flex flex-col md:flex-row text-slate-900 dark:text-slate-100 selection:bg-blue-200 dark:selection:bg-blue-900">
              
              {/* RESPONSIVE NAVIGATION */}
              <nav className="fixed z-40 flex bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-slate-200 dark:border-slate-800 transition-colors
                              bottom-0 left-0 right-0 justify-around px-2 sm:px-4 py-2 sm:py-3 border-t shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)] dark:shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.5)]
                              md:top-0 md:w-64 md:flex-col md:justify-start md:border-t-0 md:border-r md:px-6 md:py-8 md:gap-2 md:shadow-none pb-safe">
                  
                  <div className="hidden md:block w-full mb-8">
                      <h1 className="text-2xl font-black tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Alon OS</h1>
                      <div className="mt-2 inline-flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-700">
                          <span className="text-xs font-medium text-slate-500 dark:text-slate-400">QPI</span>
                          <span className="text-sm font-bold text-slate-900 dark:text-white">{qpi}</span>
                      </div>
                  </div>

                  {[
                      { id: 'dashboard', icon: icons.home, label: 'Dashboard' },
                      { id: 'cuts', icon: icons.chart, label: 'Cuts Tracker' },
                      { id: 'readings', icon: icons.book, label: 'Readings' },
                      { id: 'focus', icon: icons.timer, label: 'Focus' }
                  ].map(tab => (
                      <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                          className={`flex flex-col md:flex-row items-center md:justify-start gap-1 md:gap-3 w-full px-2 py-2 md:px-4 md:py-3.5 rounded-xl md:rounded-2xl transition-all duration-200 relative
                                      ${activeTab === tab.id 
                                        ? 'text-blue-600 dark:text-blue-400 md:bg-blue-50 md:dark:bg-blue-900/20 md:border md:border-blue-100 md:dark:border-blue-800/50' 
                                        : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 md:border md:border-transparent md:hover:bg-slate-50 md:dark:hover:bg-slate-800/50'}`}
                      >
                          <div className="relative">
                              <Icon path={tab.icon} className="w-6 h-6 md:w-5 md:h-5" />
                              {tab.id === 'readings' && readings.filter(r => r.status === 'To Read').length > 0 && (
                                  <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white dark:border-slate-900 md:-top-0.5 md:-right-0.5"></span>
                              )}
                          </div>
                          <span className={`text-[10px] md:text-sm font-bold tracking-wide md:tracking-normal ${activeTab === tab.id ? 'md:font-black' : 'md:font-semibold'}`}>{tab.label}</span>
                      </button>
                  ))}
              </nav>

              {/* MAIN CONTENT AREA */}
              <main className="flex-1 w-full md:pl-64 flex flex-col min-h-screen relative pb-24 md:pb-0">
                  
                  <header className="px-5 py-4 md:px-8 md:py-6 sticky top-0 z-20 backdrop-blur-xl bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/50 dark:border-slate-800 transition-colors flex justify-between items-center">
                      <div className="md:hidden flex flex-col justify-center">
                          <h1 className="text-xl font-black tracking-tight leading-tight">Alon OS</h1>
                          <p className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase">{greeting}</p>
                      </div>
                      <div className="hidden md:flex flex-col">
                          <h2 className="text-2xl font-bold capitalize tracking-tight text-slate-800 dark:text-slate-100">{activeTab}</h2>
                          <p className="text-sm text-slate-500 dark:text-slate-400 font-medium">{greeting}, Alon.</p>
                      </div>

                      <div className="flex items-center gap-2">
                          <div className="md:hidden text-xs font-bold bg-slate-100 dark:bg-slate-800 px-2.5 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 mr-1">QPI {qpi}</div>
                          <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full text-slate-600 dark:text-yellow-400 transition-colors">
                              <Icon path={darkMode ? icons.sun : icons.moon} className="w-4 h-4" />
                          </button>
                          <button onClick={() => setIsSettingsOpen(true)} className="p-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full text-slate-600 dark:text-slate-300 transition-colors">
                              <Icon path={icons.settings} className="w-4 h-4" />
                          </button>
                      </div>
                  </header>

                  {toast && (
                      <div className={`fixed top-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full text-sm font-bold shadow-2xl animate-slide-up flex items-center gap-2 border ${toast.isError ? 'bg-red-50 dark:bg-red-900 text-red-600 dark:text-red-200 border-red-200 dark:border-red-800' : 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-slate-700 dark:border-slate-200'}`}>
                          {!toast.isError && <Icon path={icons.check} className="w-4 h-4 text-green-400 dark:text-green-600" />} {toast.msg}
                      </div>
                  )}

                  <div className="p-4 md:p-8 flex-1 max-w-7xl mx-auto w-full">
                    
                    {/* DASHBOARD TAB */}
                    {activeTab === 'dashboard' && (
                      <div className="animate-fade-in space-y-6 md:space-y-8 md:max-w-4xl mx-auto">
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-center items-center">
                                <span className="text-slate-400 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1">Total Absences</span>
                                <span className="text-2xl md:text-3xl font-black text-slate-800 dark:text-white">{totalCuts}</span>
                            </div>
                            <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-center items-center">
                                <span className="text-slate-400 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1">Pending Readings</span>
                                <span className="text-2xl md:text-3xl font-black text-slate-800 dark:text-white">{readings.filter(r => r.status !== 'Done').length}</span>
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-indigo-600 to-blue-700 dark:from-indigo-900 dark:to-slate-800 rounded-3xl p-6 md:p-8 text-white shadow-xl shadow-blue-500/20 dark:shadow-none relative overflow-hidden">
                          <div className="absolute top-0 right-0 -mt-8 -mr-8 w-40 h-40 bg-white opacity-10 rounded-full blur-2xl"></div>
                          <div className="relative z-10">
                            <div className="flex items-center gap-2 mb-2">
                                <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                                <p className="text-blue-100 text-xs font-bold uppercase tracking-widest">Up Next</p>
                            </div>
                            <h2 className="text-3xl md:text-5xl font-black tracking-tight mb-1">SOCIO 192.1</h2>
                            <p className="text-blue-100 font-medium md:text-lg mb-8">Section B • Dr. Clamor</p>
                            <div className="flex items-center gap-3 bg-black/20 p-4 rounded-2xl border border-white/10 backdrop-blur-sm">
                                <span className="text-xl">📍</span>
                                <span className="font-mono font-bold text-lg md:text-xl tracking-tight">SOM 111</span>
                                <span className="ml-auto text-xs md:text-sm font-black bg-white text-blue-900 px-3 py-1.5 rounded-lg shadow-sm">NOW</span>
                            </div>
                          </div>
                        </div>

                        <div>
                            <div className="flex justify-between items-center mb-4 px-1">
                                <h3 className="font-bold text-lg md:text-xl text-slate-800 dark:text-slate-200">{schedule.title}</h3>
                                {schedule.title.includes('Thursday') && <span className="text-[10px] md:text-xs font-black text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 px-3 py-1.5 rounded-full border border-red-100 dark:border-red-800/50 uppercase tracking-widest">The Marathon</span>}
                            </div>
                            <div className="space-y-3">
                                {schedule.classes.map(c => (
                                    <div key={c.id} onClick={() => setEditingCourse(c)} className="flex gap-4 p-4 bg-white dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-700 cursor-pointer shadow-sm group transition-all">
                                        <div className="flex-shrink-0 w-16 text-center md:flex md:flex-col md:justify-center">
                                            <div className="font-black text-slate-700 dark:text-slate-200 text-sm md:text-base">{c.time.split(' - ')[0]}</div>
                                            <div className="text-[10px] md:text-xs text-slate-400 font-semibold">{c.time.split(' - ')[1]}</div>
                                        </div>
                                        <div className="flex-grow border-l-2 pl-4 border-slate-100 dark:border-slate-700 group-hover:border-blue-200 dark:group-hover:border-blue-800 transition-colors flex flex-col justify-center">
                                            <div className="inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide border self-start mb-1 mr-auto flex-none w-auto" className={`inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide border self-start mb-1 ${c.color}`}>{c.code}</div>
                                            <h4 className="font-bold text-slate-800 dark:text-slate-100 text-sm md:text-base truncate">{c.name}</h4>
                                            <div className="flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium"><span>📍</span> <span>{c.venue}</span></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                      </div>
                    )}

                    {/* CUTS TAB */}
                    {activeTab === 'cuts' && (
                      <div className="animate-fade-in grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                          {courses.map(c => { 
                              const pct = (c.cuts / c.maxCuts) * 100; 
                              const isDanger = c.cuts >= c.maxCuts - 1; 
                              return (
                                  <div key={c.id} className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col">
                                      <div className="flex justify-between items-start mb-5">
                                          <div>
                                              <h3 className="font-black text-lg text-slate-800 dark:text-white mb-1">{c.code}</h3>
                                              <button onClick={() => setEditingCourse(c)} className="text-xs text-slate-400 hover:text-blue-500 font-medium underline decoration-slate-200 dark:decoration-slate-600 underline-offset-4 transition-colors">Course Settings</button>
                                          </div>
                                          <div className="text-right bg-slate-50 dark:bg-slate-900/50 px-3 py-2 rounded-xl border border-slate-100 dark:border-slate-700">
                                              <span className={`text-2xl font-black ${isDanger ? 'text-red-500' : 'text-slate-800 dark:text-slate-200'}`}>{c.cuts}</span>
                                              <span className="text-slate-400 text-sm font-bold ml-1">/{c.maxCuts}</span>
                                          </div>
                                      </div>
                                      <div className="w-full bg-slate-100 dark:bg-slate-700/50 rounded-full h-3 mb-6 overflow-hidden border border-slate-200/50 dark:border-slate-600/50">
                                          <div className={`h-full rounded-full transition-all duration-700 ease-out ${isDanger ? 'bg-gradient-to-r from-red-500 to-rose-500' : 'bg-gradient-to-r from-blue-500 to-indigo-500'}`} style={{ width: `${pct}%` }}></div>
                                      </div>
                                      <div className="grid grid-cols-2 gap-3 mt-auto">
                                          <button onClick={() => { if(c.cuts > 0) { setCourses(courses.map(x => x.id === c.id ? { ...x, cuts: x.cuts - 1 } : x)); showToast("Cut Removed"); } }} className="py-3 text-sm font-bold text-slate-500 bg-slate-50 hover:bg-slate-100 dark:bg-slate-700 dark:text-slate-300 rounded-xl transition-colors">Undo</button>
                                          <button onClick={() => { if(c.cuts < c.maxCuts) { setCourses(courses.map(x => x.id === c.id ? { ...x, cuts: x.cuts + 1 } : x)); showToast("Marked Absent"); } }} disabled={c.cuts >= c.maxCuts} className="py-3 text-sm font-bold text-white bg-slate-900 dark:bg-blue-600 rounded-xl transition-all disabled:opacity-50">+ Absent</button>
                                      </div>
                                  </div>
                              ); 
                          })}
                      </div>
                    )}

                    {/* READINGS TAB */}
                    {activeTab === 'readings' && (
                      <div className="animate-fade-in space-y-6">
                          <div className="flex justify-end md:justify-between items-center px-1">
                              <p className="text-sm font-medium text-slate-500 dark:text-slate-400 hidden md:block">Manage your required readings across all subjects.</p>
                              <button onClick={() => setReadingModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white text-xs md:text-sm font-bold px-5 py-2.5 rounded-full shadow-lg shadow-blue-500/30 flex items-center gap-2 transition-all">
                                  <Icon path={icons.plus} className="w-4 h-4" /> ADD READING
                              </button>
                          </div>
                          
                          {readings.length === 0 && (
                              <div className="text-center py-20 bg-slate-50 dark:bg-slate-800/30 rounded-3xl border border-dashed border-slate-200 dark:border-slate-700">
                                  <span className="text-4xl block mb-4">🏖️</span>
                                  <h3 className="text-lg font-bold text-slate-700 dark:text-slate-300">All caught up!</h3>
                              </div>
                          )}
                          
                          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                              {sortedReadings.map(r => (
                                  <div key={r.id} onClick={() => { 
                                      const order = ['To Read', 'In Progress', 'Done']; 
                                      setReadings(readings.map(x => x.id === r.id ? { ...x, status: order[(order.indexOf(r.status) + 1) % 3] } : x)); 
                                  }} className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 flex gap-4 active:scale-[0.98] transition-all cursor-pointer group relative shadow-sm hover:shadow-md">
                                      <div className={`flex-shrink-0 w-6 h-6 rounded-full border-2 mt-0.5 flex items-center justify-center transition-all duration-300 ${ r.status === 'Done' ? 'bg-green-500 border-green-500 shadow-lg shadow-green-500/20' : r.status === 'In Progress' ? 'border-amber-400 bg-amber-50 dark:bg-amber-900/30' : 'border-slate-300 dark:border-slate-600' }`}>
                                          {r.status === 'Done' && <span className="text-white text-xs font-bold">✓</span>}
                                      </div>
                                      <div className="flex-grow pr-8">
                                          <div className="flex items-center gap-2 mb-1.5">
                                              <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{r.course}</span>
                                              <span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600"></span>
                                              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wide">{r.module}</span>
                                          </div>
                                          <h3 className={`font-bold text-slate-800 dark:text-slate-100 text-sm leading-snug mb-3 ${r.status === 'Done' ? 'line-through text-slate-400 dark:text-slate-500' : ''}`}>{r.title}</h3>
                                          <div className={`inline-flex px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wide border ${ r.status === 'Done' ? 'bg-green-50 text-green-700 border-green-200 dark:bg-green-900/20 dark:text-green-400 dark:border-green-800/50' : r.status === 'In Progress' ? 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-900/20 dark:text-amber-400 dark:border-amber-800/50' : 'bg-slate-50 text-slate-500 border-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:border-slate-600' }`}>{r.status}</div>
                                      </div>
                                      <button onClick={(e) => deleteReading(r.id, e)} className="absolute top-4 right-4 text-slate-300 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 opacity-0 group-hover:opacity-100 md:opacity-100">
                                          <Icon path={icons.trash} className="w-4 h-4" />
                                      </button>
                                  </div>
                              ))}
                          </div>
                      </div>
                    )}

                    {/* FOCUS TAB (POMODORO) */}
                    {activeTab === 'focus' && (
                        <div className="animate-fade-in flex flex-col items-center justify-center min-h-[60vh] md:min-h-[70vh]">
                            <div className={`w-72 h-72 md:w-96 md:h-96 rounded-full border-[8px] flex flex-col items-center justify-center relative shadow-2xl transition-colors duration-500
                                            ${pomoMode === 'focus' ? 'border-blue-500 dark:border-blue-600 shadow-blue-500/20 bg-blue-50 dark:bg-blue-900/10' : 'border-green-500 dark:border-green-600 shadow-green-500/20 bg-green-50 dark:bg-green-900/10'}`}>
                                
                                <span className="text-sm md:text-base font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2">
                                    {pomoMode === 'focus' ? 'Deep Work' : 'Break Time'}
                                </span>
                                
                                <span className="text-6xl md:text-8xl font-black text-slate-900 dark:text-white font-mono-timer tracking-tighter">
                                    {formatTime(pomoTime)}
                                </span>

                                <div className="absolute -bottom-6 flex gap-4">
                                    <button onClick={() => setIsPomoRunning(!isPomoRunning)} className={`px-8 py-3 rounded-full font-black text-white shadow-lg transition-transform active:scale-95 ${isPomoRunning ? 'bg-amber-500 hover:bg-amber-600' : 'bg-slate-900 dark:bg-blue-600 hover:opacity-90'}`}>
                                        {isPomoRunning ? 'PAUSE' : 'START'}
                                    </button>
                                </div>
                            </div>

                            <div className="mt-16 flex gap-4">
                                <button onClick={() => { setIsPomoRunning(false); setPomoMode('focus'); setPomoTime(25*60); }} className="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white uppercase">Reset Focus</button>
                                <button onClick={() => { setIsPomoRunning(false); setPomoMode('break'); setPomoTime(5*60); }} className="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white uppercase">Skip to Break</button>
                            </div>
                        </div>
                    )}

                  </div>
              </main>

              {/* SETTINGS MODAL */}
              <Modal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="OS Settings">
                  <div className="space-y-6">
                      <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-800/50 flex flex-col gap-3">
                          <h4 className="text-xs font-bold uppercase tracking-wider text-blue-800 dark:text-blue-300">Data Management</h4>
                          <button onClick={exportData} className="w-full flex justify-between items-center bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 p-3 rounded-lg font-bold text-sm border border-slate-200 dark:border-slate-700 hover:border-blue-300 transition-colors shadow-sm">
                              <span>Export Backup (.json)</span><Icon path={icons.download} className="w-4 h-4" />
                          </button>
                          <label className="w-full flex justify-between items-center bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 p-3 rounded-lg font-bold text-sm border border-slate-200 dark:border-slate-700 hover:border-blue-300 transition-colors shadow-sm cursor-pointer">
                              <span>Import Backup</span><Icon path={icons.upload} className="w-4 h-4" />
                              <input type="file" accept=".json" onChange={importData} ref={fileInputRef} className="hidden" />
                          </label>
                          <button onClick={exportCalendar} className="w-full flex justify-between items-center bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 p-3 rounded-lg font-bold text-sm border border-slate-200 dark:border-slate-700 hover:border-blue-300 transition-colors shadow-sm">
                              <span>Add Schedule to Google Calendar</span><Icon path={icons.calendar} className="w-4 h-4" />
                          </button>
                      </div>

                      <div className="bg-red-50 dark:bg-red-900/20 p-4 rounded-xl border border-red-100 dark:border-red-800/50 flex flex-col gap-3">
                          <h4 className="text-xs font-bold uppercase tracking-wider text-red-800 dark:text-red-300">Danger Zone</h4>
                          <button onClick={factoryReset} className="w-full flex justify-between items-center bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 p-3 rounded-lg font-bold text-sm border border-red-200 dark:border-red-800/50 hover:bg-red-50 transition-colors shadow-sm">
                              <span>Factory Reset</span><Icon path={icons.trash} className="w-4 h-4" />
                          </button>
                      </div>
                  </div>
              </Modal>

              {/* ADD READING MODAL */}
              <Modal isOpen={isReadingModalOpen} onClose={() => setReadingModalOpen(false)} title="Add New Reading">
                  <div className="space-y-4">
                      <div>
                          <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">Title / Chapter</label>
                          <input autoFocus value={newReading.title} onChange={e => setNewReading({...newReading, title: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-900 dark:text-white p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Giddens Ch. 1" />
                      </div>
                      <div>
                          <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">Select Course</label>
                          <div className="relative">
                              <select value={newReading.course} onChange={e => setNewReading({...newReading, course: e.target.value})} className="w-full appearance-none bg-slate-50 dark:bg-slate-900 dark:text-white p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                  <option value="">Choose...</option>
                                  {courses.map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
                              </select>
                              <div className="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">▼</div>
                          </div>
                      </div>
                      <div>
                          <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">Module / Week</label>
                          <input value={newReading.module} onChange={e => setNewReading({...newReading, module: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-900 dark:text-white p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Week 4" />
                      </div>
                      <div className="pt-2">
                          <button onClick={handleAddReading} className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 active:scale-95 transition-all">Add to Queue</button>
                      </div>
                  </div>
              </Modal>

              {/* EDIT COURSE MODAL */}
              <Modal isOpen={!!editingCourse} onClose={() => setEditingCourse(null)} title={`Settings: ${editingCourse?.code}`}>
                  {editingCourse && (
                      <div className="space-y-4">
                          <div className="grid grid-cols-2 gap-3">
                              <div>
                                  <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Venue / Room</label>
                                  <input value={editingCourse.venue} onChange={e => setEditingCourse({...editingCourse, venue: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-900 dark:text-white p-3 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                              </div>
                              <div>
                                  <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Current Grade (QPI)</label>
                                  <div className="relative">
                                      <select value={editingCourse.grade || ''} onChange={e => setEditingCourse({...editingCourse, grade: e.target.value})} className="w-full appearance-none bg-slate-50 dark:bg-slate-900 dark:text-white p-3 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                          <option value="">None</option>
                                          {Object.keys(GRADE_VALUES).map(g => <option key={g} value={g}>{g} ({GRADE_VALUES[g].toFixed(1)})</option>)}
                                      </select>
                                      <div className="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">▼</div>
                                  </div>
                              </div>
                          </div>
                          <div>
                              <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Course Notes / Syllabus Link</label>
                              <textarea rows="3" value={editingCourse.notes || ''} onChange={e => setEditingCourse({...editingCourse, notes: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-900 dark:text-white p-3 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" placeholder="Paste Zoom links, reminders, or notes here..."></textarea>
                          </div>
                          <div className="pt-2">
                              <button onClick={saveCourseEdit} className="w-full bg-slate-900 dark:bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:opacity-90 active:scale-95 transition-all">Save Changes</button>
                          </div>
                      </div>
                  )}
              </Modal>
            </div>
          );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
